services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: cloud-task-api:local
    container_name: cloud-task-api
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      SERVER_PORT: "8080"
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-default}
      JAVA_OPTS: "${JAVA_OPTS:--XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError -Djava.security.egd=file:/dev/urandom}"
    restart: unless-stopped
    networks:
      - task-api-net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

networks:
  task-api-net:
    name: task-api-net
    driver: bridge
