# Manual deployment workflow.
#
# This file does not run on push or pull request. Run it from the Actions tab
# with "Run workflow" after these repository secrets exist:
#
#   VM_HOST      Public IP or DNS name of the Ubuntu VM
#   VM_USER      SSH user that can run Docker
#   VM_SSH_KEY   Private key for that user (the matching public key is on the VM)
#   VM_APP_DIR   Absolute path of the cloned repository on the VM, such as /opt/cloud-task-api
#
# Do not commit key material, tokens, or passwords. GitHub injects the secrets
# at runtime and this workflow does not print them.

name: Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Ubuntu VM
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Require deployment secrets
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          VM_APP_DIR: ${{ secrets.VM_APP_DIR }}
        run: |
          set -eu
          test -n "$VM_HOST" || { echo "Missing GitHub secret VM_HOST"; exit 1; }
          test -n "$VM_USER" || { echo "Missing GitHub secret VM_USER"; exit 1; }
          test -n "$VM_SSH_KEY" || { echo "Missing GitHub secret VM_SSH_KEY"; exit 1; }
          test -n "$VM_APP_DIR" || { echo "Missing GitHub secret VM_APP_DIR"; exit 1; }
          case "$VM_APP_DIR" in
            /*) ;;
            *) echo "VM_APP_DIR must be an absolute path"; exit 1 ;;
          esac

      - name: Deploy over SSH
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          VM_APP_DIR: ${{ secrets.VM_APP_DIR }}
        run: |
          set -eu
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=accept-new \
            "$VM_USER@$VM_HOST" \
            "cd '$VM_APP_DIR' && git pull --ff-only && docker compose up --build -d && docker compose ps"
          rm -f ~/.ssh/deploy_key
